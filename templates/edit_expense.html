{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add-expense.css') }}">
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Edit expense</h1>
            <p class="auth-subtitle">Update the details of this spend.</p>
        </div>
        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('edit_expense', id=expense_id) }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input class="form-input" type="number" id="amount" name="amount"
                           step="0.01" min="0.01" value="{{ amount or '' }}"
                           placeholder="0.00" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select class="form-input" id="category" name="category" required>
                        <option value="" disabled {% if not category %}selected{% endif %}>Choose a category</option>
                        {% for c in categories %}
                        <option value="{{ c }}" {% if category == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input class="form-input" type="date" id="date" name="date"
                           value="{{ date or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="form-optional">(optional)</span></label>
                    <input class="form-input" type="text" id="description" name="description"
                           value="{{ description or '' }}" placeholder="e.g. Lunch with team">
                </div>
                <button type="submit" class="btn-submit">Save changes</button>
            </form>
            <p class="auth-switch"><a href="{{ url_for('profile') }}">&larr; Back to dashboard</a></p>
        </div>
    </div>
</section>
{% endblock %}
